<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogiTrans Express — Iniciar sesión</title>
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="login-page">

<div class="login-container">
    <div class="login-left">
        <div class="animation-wrapper">
            <img src="assets/img/bus.svg" alt="Animación de camión">
        </div>
    </div>

    <div class="login-right">
        <div class="login-card">
            <div class="login-logo">
                <h1>LogiTrans Express</h1>
                <p>Sistema de Control de Rutas y Transporte</p>
            </div>

            <div id="alert-container"></div>

            <form id="login-form" novalidate>
                <div class="form-group">
                    <label for="username">Usuario o correo electrónico <span class="required">*</span></label>
                    <input
                        type="text"
                        id="username"
                        class="form-control"
                        placeholder="admin"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Contraseña <span class="required">*</span></label>
                    <input
                        type="password"
                        id="password"
                        class="form-control"
                        placeholder="••••••••"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <button type="submit" id="btn-login" class="btn btn-primary btn-block btn-lg" style="margin-top:.5rem">
                    Ingresar
                </button>
            </form>

            <p class="text-center text-muted text-sm mt-2">
                LogiTrans Express &copy; 2025
            </p>
        </div>
    </div>
</div>

<script src="assets/js/config.js"></script>
<script src="assets/js/utils.js"></script>
<script src="assets/js/login.js"></script>
</body>
</html>
