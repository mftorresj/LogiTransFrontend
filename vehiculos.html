<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehículos — LogiTrans Express</title>
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

<nav class="navbar">
    <span class="navbar-brand"><span class="brand-icon"></span> LogiTrans Express</span>
    <span class="navbar-spacer"></span>
    <div class="navbar-user">
        <strong id="nav-user"></strong>
        <button class="btn btn-outline btn-sm" onclick="logout()">Cerrar sesión</button>
    </div>
</nav>

<aside class="sidebar">
    <nav>
        <p class="sidebar-section">Menú principal</p>
        <ul class="sidebar-nav">
            <li><a href="dashboard.html">
                <span class="nav-icon"></span> Dashboard</a></li>
            <li><a href="conductores.html">
                <span class="nav-icon"></span> Conductores</a></li>
            <li><a href="vehiculos.html" class="active">
                <span class="nav-icon"></span> Vehículos</a></li>
            <li><a href="rutas.html" >
                <span class="nav-icon"></span> Rutas</a></li>
            <li><a href="programacion.html">
                <span class="nav-icon"></span> Programación</a></li>
            <li><a href="viajes.html">
                <span class="nav-icon"></span> Viajes</a></li>
        </ul>
    </nav>
</aside>

<main class="main-content">
    <div id="alert-container"></div>

    <div class="page-header">
        <h2>Vehículos</h2>
        <button id="btn-nuevo" class="btn btn-primary">+ Nuevo vehículo</button>
    </div>

    <div class="card">
        <div class="toolbar">
            <input type="text" id="buscar" class="form-control" placeholder="Buscar por placa, marca, modelo o tipo...">
            <select id="filtro-estado" class="form-control" style="max-width:180px">
                <option value="">Todos los estados</option>
                <option value="disponible">Disponible</option>
                <option value="en_ruta">En ruta</option>
                <option value="mantenimiento">Mantenimiento</option>
                <option value="inactivo">Inactivo</option>
            </select>
            <select id="filtro-tipo" class="form-control" style="max-width:180px">
                <option value="">Todos los tipos</option>
                <option value="Camión">Camión</option>
                <option value="Furgón">Furgón</option>
                <option value="Bus">Bus</option>
                <option value="Tracto">Tracto</option>
            </select>
            <button class="btn btn-outline btn-sm" onclick="cargarVehiculos()">Actualizar</button>
        </div>

        <div class="relative">
            <div id="loader" style="display:none; position:absolute; inset:0; background:rgba(255,255,255,.82); z-index:10; align-items:center; justify-content:center; border-radius:8px;">
                <div class="spinner"></div>
            </div>
            <div class="table-responsive">
                <table class="table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Placa</th>
                            <th>Tipo</th>
                            <th>Marca / Modelo</th>
                            <th>Capacidad</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-vehiculos">
                        <tr><td colspan="7" class="text-center text-muted">Cargando...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<div id="modal-vehiculo" class="modal-overlay">
    <div class="modal">
        <div class="modal-header">
            <h3 id="modal-titulo">Nuevo Vehículo</h3>
            <button class="modal-close" onclick="cerrarModal()">×</button>
        </div>
        <form id="form-vehiculo" novalidate>
            <div class="modal-body">
                <div class="form-row">
                    <div class="form-group">
                        <label>Placa <span class="required">*</span></label>
                        <input type="text" id="f-placa" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>Tipo <span class="required">*</span></label>
                        <input type="text" id="f-tipo" class="form-control" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Capacidad de carga (toneladas) <span class="required">*</span></label>
                        <input type="number" id="f-capacidad" class="form-control" min="0.1" step="0.1" required>
                    </div>
                    <div class="form-group">
                        <label>Estado</label>
                        <select id="f-estado" class="form-control">
                            <option value="disponible">Disponible</option>
                            <option value="en_ruta">En ruta</option>
                            <option value="mantenimiento">Mantenimiento</option>
                            <option value="inactivo">Inactivo</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Marca</label>
                        <input type="text" id="f-marca" class="form-control">
                    </div>
                    <div class="form-group">
                        <label>Modelo</label>
                        <input type="text" id="f-modelo" class="form-control">
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" id="btn-cancelar" class="btn btn-outline">Cancelar</button>
                <button type="submit" id="btn-guardar" class="btn btn-primary">Guardar</button>
            </div>
        </form>
    </div>
</div>

<script src="assets/js/config.js"></script>
<script src="assets/js/utils.js"></script>
<script src="assets/js/vehiculos.js"></script>
<script src="assets/js/auth.js"></script>
</body>
</html>
